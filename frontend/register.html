
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Campus Lost and Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <h2>Campus Lost & Found</h2>
            <div>
                <a href="index.html">Home</a>
                <a href="browse.html">Browse Items</a>
                <a href="report.html">Report Item</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </div>
        </nav>
    </header>

    <section class="hero">
        <h1>Create Your Account</h1>
        <p>Join the Campus Lost and Found Portal.</p>
    </section>

    <section class="report-section">
        <h2>Student Registration</h2>

        <form id="registerForm">
            <label>Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >

            <button type="submit">Register</button>
        </form>

        <p>Already have an account? <a href="login.html">Login here</a></p>
    </section>

    <footer>
        <p>© 2026 Campus Lost and Found Portal | Sai University</p>
    </footer>

    <script src="register.js"></script>

</body>
</html>
