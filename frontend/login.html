
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Lost and Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <h2>Campus Lost & Found</h2>
            <div>
                <a href="index.html">Home</a>
                <a href="browse.html">Browse Items</a>
                <a href="report.html">Report Item</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </div>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome Back!</h1>
        <p>Login to your Campus Lost and Found account.</p>
    </section>

    <section class="report-section">
        <h2>Login</h2>

        <form id="loginForm">
            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <p>Don't have an account? <a href="register.html">Register here</a></p>
    </section>

    <footer>
        <p>© 2026 Campus Lost and Found Portal | Sai University</p>
    </footer>

    <script src="login.js"></script>

</body>
</html>
